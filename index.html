<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todos • Kullanıcı Paneli</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:36px 16px}.shell{max-width:850px;margin:auto}.panel{background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #14243a12}h1{margin:0 0 6px;font-size:27px}h2{font-size:19px}.muted{color:#64748b;font-size:14px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1}.tabs .active{background:#116d59;color:#fff}input,textarea,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #cbd5e1}input,textarea,select{width:100%;background:#fff}button{background:#116d59;color:#fff;border:0;cursor:pointer}button:hover{filter:brightness(.95)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e9eef5;color:#1e293b}.danger{background:#b33b48}.fields{display:grid;gap:12px}.fields label{font-size:13px;font-weight:650;display:grid;gap:5px}.hidden{display:none!important}.notice{padding:10px 12px;background:#eef7f4;border-radius:9px;margin:14px 0;font-size:14px;white-space:pre-wrap}.notice.error{background:#fff0f1;color:#9b2736}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.task-form{display:grid;grid-template-columns:1fr 145px auto;gap:9px;margin-top:20px}.description{margin:10px 0 0;min-height:64px}.tasks{padding:0;list-style:none}.tasks li{border-bottom:1px solid #e2e8f0;padding:13px 0;display:flex;gap:10px;align-items:center}.tasks li input[type=checkbox]{width:auto}.tasktext{flex:1;min-width:0;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#64748b}.actions{display:flex;gap:6px}.actions button{padding:8px}.link{border:0;background:none;color:#116d59;padding:5px;text-decoration:underline}.small{font-size:12px;color:#64748b}@media(max-width:650px){.task-form{grid-template-columns:1fr}.tasks li{flex-wrap:wrap}.actions{margin-left:auto}}
</style></head><body><div class="shell"><main class="panel"><section id="authPanel"><h1>Todos'a Hoş Geldiniz</h1><p class="muted">Hesabınıza giriş yapın veya yeni hesap oluşturun.</p><div class="tabs"><button id="loginTab" class="active" type="button">Giriş yap</button><button id="signupTab" class="secondary" type="button">Kayıt ol</button></div><form id="authForm" class="fields"><label>E-posta<input id="email" type="email" autocomplete="email" required></label><label>Şifre<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="authSubmit" type="submit">Giriş yap</button></form><button id="forgot" type="button" class="link">Şifremi unuttum</button></section>
<section id="resetPanel" class="hidden"><h1>Yeni şifre belirle</h1><form id="resetForm" class="fields"><label>Yeni şifre<input id="newPassword" type="password" minlength="6" required></label><button type="submit">Şifreyi güncelle</button></form></section>
<section id="appPanel" class="hidden"><div class="top"><div><h1>Yapılacaklar Listesi</h1><div class="muted" id="who"></div></div><button id="logout" type="button" class="secondary">Çıkış yap</button></div><form id="todoForm" class="task-form"><input id="title" maxlength="200" placeholder="Yeni görev" required><select id="priority"><option>Orta</option><option>Yüksek</option><option>Düşük</option></select><button id="add" type="submit">Görev ekle</button></form><textarea id="description" class="description" placeholder="Açıklama (isteğe bağlı)"></textarea><ul id="tasks" class="tasks"></ul></section><p id="notice" class="notice" role="status">Bağlantı hazırlanıyor...</p></main></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// YALNIZCA BU İKİ DEĞERİ DEĞİŞTİRİN. Secret/service_role anahtarı kullanmayın.
const SUPABASE_URL='https://sriefpcratvjpvqaigtw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_IswDfNUtGAEUCVx1TEXvAQ_hahXtVRu';
const $=id=>document.getElementById(id);
const notice=(message,error=false)=>{$('notice').textContent=message;$('notice').classList.toggle('error',error)};
const configured=!SUPABASE_URL.startsWith('BURAYA')&&!SUPABASE_ANON_KEY.startsWith('BURAYA');
let supabase, currentUser=null, mode='login', recovery=false;
function panel(name){for(const id of ['authPanel','appPanel','resetPanel'])$(id).classList.toggle('hidden',id!==name)}
function setMode(value){mode=value;$('authSubmit').textContent=value==='login'?'Giriş yap':'Kayıt ol';$('loginTab').className=value==='login'?'active':'secondary';$('signupTab').className=value==='signup'?'active':'secondary';$('password').autocomplete=value==='login'?'current-password':'new-password';$('forgot').classList.toggle('hidden',value!=='login')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
async function showSession(session){currentUser=session?.user||null;if(!currentUser){panel('authPanel');$('tasks').replaceChildren();return}panel('appPanel');$('who').textContent=currentUser.email||'Kullanıcı';await loadTodos()}
async function loadTodos(){if(!currentUser)return;const {data,error}=await supabase.from('todos').select('id,title,description,priority,completed,created_at').order('created_at',{ascending:false}).limit(100);if(error){notice('Görevler yüklenemedi: '+error.message,true);return}const list=$('tasks');list.replaceChildren();for(const todo of data){const li=document.createElement('li');const check=document.createElement('input');check.type='checkbox';check.checked=todo.completed;check.setAttribute('aria-label','Tamamlandı');check.onchange=async()=>{const {error}=await supabase.from('todos').update({completed:check.checked}).eq('id',todo.id);if(error)notice(error.message,true);await loadTodos()};const content=document.createElement('div');content.className='tasktext';const title=document.createElement('div');title.textContent=todo.title;title.className=todo.completed?'done':'';const detail=document.createElement('div');detail.className='small';detail.textContent=todo.priority+' öncelik'+(todo.description?' • '+todo.description:'');content.append(title,detail);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Düzenle';edit.onclick=async()=>{const newTitle=prompt('Görev başlığı:',todo.title);if(newTitle===null)return;if(!newTitle.trim()){notice('Başlık boş olamaz.',true);return}const newDescription=prompt('Açıklama:',todo.description||'');if(newDescription===null)return;const {error}=await supabase.from('todos').update({title:newTitle.trim(),description:newDescription}).eq('id',todo.id);if(error)notice(error.message,true);else await loadTodos()};const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Sil';del.onclick=async()=>{if(!confirm('Görev silinsin mi?'))return;const {error}=await supabase.from('todos').delete().eq('id',todo.id);if(error)notice(error.message,true);else await loadTodos()};actions.append(edit,del);li.append(check,content,actions);list.append(li)}notice(`${data.length} görev listeleniyor (en fazla 100).`)}
$('authForm').onsubmit=async e=>{e.preventDefault();if(!configured)return;const email=$('email').value.trim(),password=$('password').value;$('authSubmit').disabled=true;try{if(mode==='signup'){const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(data.session){await showSession(data.session);notice('Hesap oluşturuldu.')}else notice('Kayıt alındı. E-posta doğrulaması açıksa gelen kutunuzdaki bağlantıya tıklayın.')}else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await showSession(data.session);notice('Giriş başarılı.')}}catch(error){notice('Kimlik doğrulama hatası: '+error.message,true)}finally{$('authSubmit').disabled=false}};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){notice('Önce e-posta adresinizi girin.',true);return}try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;notice('Şifre sıfırlama bağlantısı gönderme isteği alındı. E-postanızı kontrol edin.')}catch(e){notice(e.message,true)}};
$('resetForm').onsubmit=async e=>{e.preventDefault();const {error}=await supabase.auth.updateUser({password:$('newPassword').value});if(error){notice(error.message,true);return}recovery=false;notice('Şifreniz güncellendi.');const {data}=await supabase.auth.getSession();await showSession(data.session)};
$('logout').onclick=async()=>{const {error}=await supabase.auth.signOut();if(error)notice(error.message,true);else{await showSession(null);notice('Çıkış yapıldı.')}};
$('todoForm').onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const title=$('title').value.trim();if(!title)return;$('add').disabled=true;const {error}=await supabase.from('todos').insert({user_id:currentUser.id,title,description:$('description').value,priority:$('priority').value,completed:false});$('add').disabled=false;if(error){notice(error.message,true);return}$('todoForm').reset();$('description').value='';await loadTodos()};
if(!configured){notice('Önce index.html dosyasında SUPABASE_URL ve SUPABASE_ANON_KEY değerlerini doldurun.',true);$('authSubmit').disabled=true}else{try{supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;panel('resetPanel');notice('Yeni şifrenizi belirleyin.')}else if(event==='SIGNED_OUT'){currentUser=null;panel('authPanel')}else if(event==='SIGNED_IN'&&!recovery){setTimeout(()=>showSession(session),0)}});const {data,error}=await supabase.auth.getSession();if(error)throw error;if(!recovery)await showSession(data.session);if(!data.session)notice('Giriş yapabilir veya yeni hesap oluşturabilirsiniz.')}catch(e){notice('Bağlantı hatası: '+e.message,true)}}
</script></body></html>
